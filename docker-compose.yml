services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/toeic.db?mode=rwc}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-720}
    volumes:
      - data:/data
      - ./content:/content:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data:
